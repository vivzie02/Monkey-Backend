version: '3.8'

services:
  db:
    image: postgres
    restart: always
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_network

  api:
    build:
      context: ./API/src/MonkeyServer
      dockerfile: Dockerfile  
    container_name: aspnet_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file: ".env"
    ports:
      - "8080:5000"
    depends_on:
      - db
    networks:
      - postgres_network

volumes:
  postgres_data:

networks:
  postgres_network:
